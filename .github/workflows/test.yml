name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a push-triggered job can only ever tell you about code you
    # just changed. This job's whole value is noticing when the ground moved:
    # an upstream yank, a rename, a dropped Python version.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# No `run:` step below interpolates untrusted event data: the only substitution
# is `matrix.python-version`, from the fixed list above. Nothing from a PR
# title/body/branch reaches a shell.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.9. This matrix is the thing that keeps that
        # claim honest instead of aspirational.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # stdlib only — deliberately no install step, because there is nothing
      # to install and a step that does nothing is a step that can break
      - name: tests
        run: python tests/test_warp.py

      - name: every module compiles
        run: python -m compileall -q warp/

      - name: CLI is wired
        run: |
          python -m warp --help > /dev/null
          python -m warp selftest > /dev/null

      - name: no hardcoded user paths in shipped code
        run: "! grep -rn --include='*.py' --include='*.html' '/home/' warp/"

  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The README claims Linux, macOS and Windows; only Linux had ever run.
        # sysproxy has three separate backends and none of the other two had
        # been executed anywhere.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # one shell for all three, so the commands below stay identical
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: tests
        run: python tests/test_warp.py

      - name: every module compiles
        run: python -m compileall -q warp/

      - name: the CLI wires up
        run: |
          python -m warp --help > /dev/null
          python -m warp selftest > /dev/null

  freebsd:
    name: freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub has no BSD runner, so proving the BSD code paths work needs a VM.
      # This is the only third-party action in this workflow — drop the job if
      # you would rather not take that dependency; nothing else depends on it.
      - name: tests on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y python3
          run: |
            python3 --version
            python3 tests/test_warp.py
            python3 -m compileall -q warp/
            python3 -m warp selftest > /dev/null

  install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The real thing: fetch the published AppImage and install it.
      - name: run the one-liner
        run: sh packaging/install.sh

      - name: the installed app runs
        # run the desktop entry's target, i.e. exactly what the user's launcher
        # does. Running the AppImage directly would pass on a host with FUSE while
        # the launcher fails on one without it.
        run: |
          EXEC=$(grep -oP '(?<=^Exec=")[^"]+' ~/.local/share/applications/warp.desktop)
          echo "launcher: $EXEC"
          "$EXEC" selftest

      - name: it left a usable launcher behind
        run: |
          test -x ~/Applications/warp.AppImage
          test -f ~/.local/share/applications/warp.desktop
          test -f ~/.local/share/icons/hicolor/512x512/apps/warp.png
          grep -q "$HOME/Applications/warp.AppImage" ~/.local/share/applications/warp.desktop

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run the one-liner
        run: powershell -ExecutionPolicy Bypass -File packaging/install.ps1

      # Run the installed launcher, not python directly — warp.cmd and the
      # PYTHONPATH it sets are the part that can silently be wrong.
      - name: the installed launcher runs
        shell: cmd
        run: '"%LOCALAPPDATA%\Programs\warp\warp.cmd" selftest'

      - name: it left a usable shortcut and command behind
        shell: pwsh
        run: |
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\warp'
          if (-not (Test-Path (Join-Path $dest 'warp.cmd')))     { throw 'no warp.cmd' }
          if (-not (Test-Path (Join-Path $dest 'packaging\warp.ico'))) { throw 'no icon' }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\warp.lnk'
          if (-not (Test-Path $lnk)) { throw 'no Start Menu shortcut' }
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($path -notlike "*$dest*") { throw 'not on the user PATH' }

  upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pinned third-party artifacts still exist upstream
        run: python packaging/check-upstreams.py

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          curl -sSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      # The upstreams job only proves the pinned artifacts exist. It cannot see
      # the script that fetches and assembles them, so a malformed API path
      # there (releases/ instead of releases/tags/) sailed straight past it and
      # only surfaced when the build was actually run. This job is that run.
      - name: build it and prove the result runs
        env:
          # the runner has no FUSE: appimagetool has to unpack itself, not mount
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./packaging/build-appimage.sh --with-python
          ./dist/warp-*-x86_64.AppImage selftest
