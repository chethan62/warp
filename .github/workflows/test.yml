name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a push-triggered job can only ever tell you about code you
    # just changed. This job's whole value is noticing when the ground moved:
    # an upstream yank, a rename, a dropped Python version.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# No `run:` step below interpolates untrusted event data: the only substitution
# is `matrix.python-version`, from the fixed list above. Nothing from a PR
# title/body/branch reaches a shell.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.9. This matrix is the thing that keeps that
        # claim honest instead of aspirational.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # stdlib only — deliberately no install step, because there is nothing
      # to install and a step that does nothing is a step that can break
      - name: tests
        run: python tests/test_warp.py

      - name: every module compiles
        run: python -m compileall -q warp/

      - name: CLI is wired
        run: |
          python -m warp --help > /dev/null
          python -m warp selftest > /dev/null

      - name: no hardcoded user paths in shipped code
        run: "! grep -rn --include='*.py' --include='*.html' '/home/' warp/"

  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The README claims Linux, macOS and Windows; only Linux had ever run.
        # sysproxy has three separate backends and none of the other two had
        # been executed anywhere.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # one shell for all three, so the commands below stay identical
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: tests
        run: python tests/test_warp.py

      - name: every module compiles
        run: python -m compileall -q warp/

      - name: the CLI wires up
        run: |
          python -m warp --help > /dev/null
          python -m warp selftest > /dev/null

  upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pinned third-party artifacts still exist upstream
        run: python packaging/check-upstreams.py

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          curl -sSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      # The upstreams job only proves the pinned artifacts exist. It cannot see
      # the script that fetches and assembles them, so a malformed API path
      # there (releases/ instead of releases/tags/) sailed straight past it and
      # only surfaced when the build was actually run. This job is that run.
      - name: build it and prove the result runs
        env:
          # the runner has no FUSE: appimagetool has to unpack itself, not mount
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./packaging/build-appimage.sh --with-python
          ./dist/warp-*-x86_64.AppImage selftest
